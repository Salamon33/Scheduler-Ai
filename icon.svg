<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Dial Ring (Adaptive Cycle) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="16" stroke-dasharray="6 14"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accent)" stroke-width="16" stroke-dasharray="500 1000" stroke-linecap="round" transform="rotate(-90 256 256)"/>

  <!-- Center Core Glyphs: Chronometer + Book + Adaptive Bolt -->
  <g filter="url(#glow)">
    <!-- Open Book / Study Symbol -->
    <path d="M190 320 C220 310, 245 316, 256 328 C267 316, 292 310, 322 320 L322 220 C292 210, 267 216, 256 228 C245 216, 220 210, 190 220 Z" 
          fill="rgba(255,255,255,0.15)" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Central Dynamic Lightning Bolt (Adaptive Engine) -->
    <path d="M266 140 L226 244 L258 244 L242 320 L292 216 L258 216 Z" 
          fill="url(#accent)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Tick Marks for 5 AM, 10 AM, etc. -->
  <circle cx="256" cy="96" r="6" fill="#10b981"/>
  <circle cx="416" cy="256" r="6" fill="#6366f1"/>
  <circle cx="256" cy="416" r="6" fill="#f59e0b"/>
  <circle cx="96" cy="256" r="6" fill="#06b6d4"/>
</svg>
